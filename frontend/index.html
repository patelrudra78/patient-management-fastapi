<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Patient Management</h1>
  <p id="summary" aria-live="polite"></p>
</header>
<main>
  <section class="panel">
    <h2 id="formTitle">Add patient</h2>
    <form id="form">
      <label>Patient ID <input id="id" required maxlength="20"></label>
      <label>Name <input id="name" required maxlength="100"></label>
      <label>City <input id="city" required maxlength="100"></label>
      <div class="row">
        <label>Age <input id="age" type="number" min="0" max="120" required></label>
        <label>Gender
          <select id="gender"><option>Male</option><option>Female</option><option>Other</option></select>
        </label>
      </div>
      <div class="row">
        <label>Height (m) <input id="height" type="number" step="0.01" min="0.3" max="2.8" required></label>
        <label>Weight (kg) <input id="weight" type="number" step="0.1" min="1" max="500" required></label>
      </div>
      <div class="row">
        <button id="save" type="submit">Add patient</button>
        <button id="cancel" type="button" class="ghost" hidden>Cancel</button>
      </div>
    </form>
  </section>
  <section class="list">
    <div class="tools">
      <input id="search" type="search" placeholder="Search by name, city or ID">
      <select id="sortBy" aria-label="Sort by">
        <option value="name">Name</option><option value="age">Age</option><option value="city">City</option>
        <option value="height">Height</option><option value="weight">Weight</option>
      </select>
      <select id="order" aria-label="Order"><option value="asc">Ascending</option><option value="desc">Descending</option></select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>City</th><th>Age</th><th>Gender</th><th>Height</th><th>Weight</th><th>BMI</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" hidden>No patients to show. Add one using the form.</p>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
